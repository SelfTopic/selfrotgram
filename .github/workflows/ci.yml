name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Новый пуш в ту же ветку отменяет ещё идущую проверку предыдущего.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Тесты (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      # --group (dev-зависимости из pyproject) понимает pip 25.1 и новее
      - run: python -m pip install -U pip
      - run: pip install --group dev -e .
      - run: pytest

  types:
    name: Типы (pyright)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install -U pip
      # dev-группа нужна примерам (sqlalchemy), иначе pyright не найдёт их импорты
      - run: pip install --group dev -e . "pyright==1.1.414"
      - run: pyright selfrot examples scripts

  generated:
    name: Сгенерированный код совпадает с генератором
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -U pip
      - run: pip install -e .
      - run: python scripts/generate_types.py
      # Если генератор или спецификация изменились, а файлы не перегенерировали, будет diff.
      - run: git diff --exit-code

  package:
    name: Установка пакета и команда selfrot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install -U pip
      # Обычная (не editable) установка: проверяет упаковку и точку входа selfrot
      - run: pip install .
      - name: Заготовка проекта на чистой установке
        run: |
          cd "$(mktemp -d)"
          selfrot --version
          selfrot init
          selfrot add router shop --module
          selfrot check --strict
          selfrot tree
